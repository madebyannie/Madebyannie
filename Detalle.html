<style>

body {
    background-color: #DCEAF7;
    font-family: "Pacifico", cursive;
    margin: 0;
    padding:0;
    text-align: center;
    color: #7A6F60;
}

.cerrar-menu{

    background:none;
    border:none;

    font-size:24px;

    color:#7A6F60;

    align-self:flex-end;

    cursor:pointer;
}

.menu-btn{

    position:absolute;

    left:15px;
    top:18px;

    font-size:22px;

    background:none;
    border:none;

    color:#7A6F60;

    cursor:pointer;

    z-index:10001;
}

.header{

    background:#F5F2E8;
    padding:18px 35px;
    display:flex;
    flex-direction:column;
    gap:18px;

}

.logo-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.barra{
    display:flex;
    justify-content:center;
    margin-top:18px;
}
.menu{
    display: flex;
    justify-content: center;
    gap: 10px;
}

.carrito{
    position:absolute;
    right:35px;
    top:50%;
    transform:translateY(-50%);

    color:#7A6F60;
    font-size:22px;
    text-decoration:none;
}

.logo{

    width:90px;
}

.texto{

    font-family:"Pacifico", cursive;
    font-size:32px;
    color:#7A6F60;
}

.texto-logo h1{

    margin:0;
    font-family:"Pacifico", cursive;
    font-size:20px;
    color:#7A6F60;

}

.header-detalle{

    width:100%;
    background:#F5F2E8;
    padding:20px 40px;
    box-sizing:border-box;
    margin:0;

}

.texto-logo p{

    margin:0;
    font-family:"Quicksand", sans-serif;
    color:#A9C7E8;
    font-size:14px;

}

.menu a{
    background:none;
    padding:0;
    border-radius:0;

    color:#7A6F60;

    text-decoration:none;

    font-family:"Quicksand",sans-serif;
    font-size:20px;

    transition:.25s;
}

.menu a:hover{
    color:#A9C7E8;
    transform:translateX(8px);
}

   .tarjeta{
    width:80%;
    margin:40px auto;
    display:flex;
    gap:50px;
    align-items:flex-start;
    background:#F5F2E8;
    border-radius:25px;
    padding:35px;
}

#nombre {
    margin-bottom: 5px;
    font-size: 24px;
    white-space: nowrap;
    margin: 10px 0 5px;
}

#precio {
    font-family: "Quicksand", sans-serif;
    color: gray;
    font-size: 18px;
    margin-top: 10px;
    margin-bottom: 12px;
}

.tarjeta p {
   font-family: "Quicksand", sans-serif;
   text-align: left;
}

.zoom{
    width:100%;
    max-width:420px;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:20px;
    cursor:zoom-in;
}

#principal{

    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .15s;
}

.mini{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:15px;
}

.mini img {
    width: 60px;
    margin: 5px;
    cursor: pointer;
    border-radius: 10px;
}

.boton {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background-color: #A9C7E8;
    color: white;
    border-radius: 15px;
    font-family: "Quicksand", sans-serif;
    text-decoration: none;
}

.boton:hover {
    background-color: #7A6F60;
}

.galeria{
    width:40%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.info{
    width:60%;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.info h2,
.info h3,
.info p{
    text-align:left;
}

footer{
    background:#F5F2E8;
    padding:25px 15px;
    width: 100%;
    text-align:center;
    margin-top:auto;
    color:#7A6F60;
    font-family: "Quicksand", sans-serif;
}

.redes{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:10px;
}

.redes img{
    width:35px;
    transition:.2s;
}

.redes img:hover{
    transform:translateY(-2px);
    color:#A9C7E8;
}

.redes a{
    color:#A9C7E8;
    transition:.25s;
}

footer p{
    margin:8px 0;
} 

#estadoProducto {
    display: flex;
    justify-content: center;
    gap: 8kpx;
    margin-top: 10px;
    margin-bottom: 12px;
}

.estado {
    padding: 5px 9px;
    border-radius: 20px;
    color: white;
    font-size: 9px;
    font-weight: bold;
    font-family: "Quicksand", sans-serif;
}

.unicoGrande {
    background-color: #A9C7E8;
}

.vendidoGrande {
    background-color: #7A6F60;
}

.nuevoGrande {
    background-color: #A9C7E8;
}

.proximamenteGrande {
    background-color: #7A6F60;
}

.pedidoGrande {
    background-color: #A9C7E8;
}

#visor {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.8);

    justify-content: center;
    align-items: center;

    z-index: 9999;
}

#visor img {

    max-width: 90%;
    max-height: 90%;

    border-radius: 15px;
}

@media (max-width: 768px){

.header-detalle{

    width:100%;

    background:#F5F2E8;

    padding:20px 40px;

    box-sizing:border-box;

    margin:0;

}
.carrito{
    width:auto;
    position:absolute;
    right:18px;
    font-size:16px;
    top:15px;
    transform:none

}

.logo{
    width:50px; 
}

.texto{
    font-size:34px;
}

.menu{
    position:fixed;
    top:0;
    left:-260px;
    width:240px;
    height:100%;
    background:#F5F2E8;

    display:flex;
    flex-direction:column;

    align-items:flex-start;
    justify-content:flex-start;

    padding:70px 25px;

    gap:25px;

    transition:.35s;
    z-index:9999;

    box-shadow:8px 0 20px rgba(0,0,0,.18);
}

.menu.activo{
    left:0;
}

.menu.activo{
    left:0;

}

.menu a{
    text-decoration:none;
    color:#7A6F60;
    background:#DCEAF7;
    padding:14px;
    border-radius:15px;
    text-align:center;
    font-family:"Quicksand", sans-serif;
}

.menu-btn{
    position:absolute;
    left:10px;
    display:block;
    top:15px;
    font-size:16px;
    background:none;
    color:#7A6F60;
    cursor:pointer;
    transform:none;

}

.barra{
  display:block;
  margin:0;

}
.logo-header{

    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding-top:10px;

}

  .tarjeta{

    max-width:1100px;

    width:90%;

    margin:40px auto;

    background:#F5F2E8;

    border-radius:25px;

}
.galeria,
.info{
 width:100%;
}

.info{
    align-items:center;
}

.info h2,
.info h3,
.info p{

    text-align:center;
  }
}

</style>

<body>

<header class="header-detalle">

    <div class="logo-header">

        <span class="texto">Made</span>

        <img src="Ann.png" class="logo">

        <span class="texto">by Annie</span>

    </div>

    <div class="barra">

    <button class="menu-btn" onclick="abrirMenu()">
        <i class="fa-solid fa-bars"></i>
    </button>


    <nav class="menu" id="menu">
        <a href="index.html">Inicio</a>
        <a href="Productos.html">Productos</a>
        <a href="Perzonaliza.html">Personalizar</a>
    </nav>

    <a href="Carrito.html" class="carrito">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>0</span>
    </a>

</div>

</header>
<div class="tarjeta">

    <div id="visor" onclick="cerrarVisor()">
        <img id="imagenGrande">
    </div>

    <!-- Columna izquierda -->
    <div class="galeria">

        <div class="zoom"
            onmousemove="zoom(event)"
            onmouseleave="resetZoom()"
            onclick="abrirVisor()">

            <img id="principal">

        </div>

        <div class="mini" id="miniaturas"></div>
         </div>

    <div class="info">

        <h2 id="nombre"></h2>

        <h3 id="precio"></h3>

        <div id="estadoProducto"></div>

        <p id="desc"></p>

        <p class="nota">
            nota..
        </p>

        <a id="btnPedir" class="boton">Pedir</a>

    </div>

</div>
<footer>

    <div class="redes">

    <a href="https://instagram.com/madebyannie.art" target="_blank">
            <img src="Insta.png" alt="Instagram">
        </a>

        <a href="https://wa.me/593982906711" target="_blank">
            <img src="Whats.png" alt="WhatsApp">
        </a>
    </div>
 <p>
 •Ibarra•Ecuador
</p>
    © 2026 Made by Annie
</footer>

<script>

const params = new URLSearchParams(window.location.search);

let nombre = params.get("nombre");

let precio = params.get("precio");

let desc = params.get("desc");

let img1 = params.get("img1");

let img2 = params.get("img2");

let img3 = params.get("img3");

let img4 = params.get("img4");

let unico = params.get("unico");

let vendido = params.get("vendido");

let nuevo = params.get("nuevo");

let pedido = params.get("pedido");

let proximamente = params.get("proximamente");

document.getElementById("nombre").innerText = nombre;

document.getElementById("precio").innerText = precio;

document.getElementById("desc").innerText = desc;

document.getElementById("principal").src = img1;

const mini = document.getElementById("miniaturas");

const imagenes = [img1, img2, img3, img4];

imagenes.forEach(imagen => {

    if(imagen && imagen !== "null"){

        const foto = document.createElement("img");

        foto.src = imagen;

        foto.onclick = function(){

            cambiar(this);

        };

        mini.appendChild(foto);

    }

});

let estado = document.getElementById("estadoProducto");

if (pedido == "si") {

    estado.innerHTML += `
    <span class="estado pedidoGrande">
        PEDIDO PERSONALIZADO
    </span>
    `;
}

if (proximamente == "si") {

    estado.innerHTML += `
    <span class="estado proximamenteGrande">
        PROXIMAMENTE
    </span>
    `;
}

if (nuevo == "si") {

    estado.innerHTML += `
    <span class="estado nuevoGrande">
        NUEVO
    </span>
    `;
}

if (unico == "si") {

    estado.innerHTML += `
    <span class="estado unicoGrande">
        PIEZA UNICA
    </span>
    `;
}

if (vendido == "si") {

    estado.innerHTML += `
    <span class="estado vendidoGrande">
        VENDIDO
    </span>
    `;
}

if (vendido == "si" || proximamente == "si" || pedido == "si") {

    document.getElementById("btnPedir").style.display = "none";

}

function cambiar(img) {

    document.getElementById("principal").src = img.src;
}

document.getElementById("btnPedir").href =

"Pedir.html?producto=" + encodeURIComponent(nombre)

+ "&img=" + encodeURIComponent(img1)

+ "&desc=" + encodeURIComponent(desc);

function zoom(event) {

    let img = document.getElementById("principal");

    let rect = event.currentTarget.getBoundingClientRect();

    let x = ((event.clientX - rect.left) / rect.width) * 100;

    let y = ((event.clientY - rect.top) / rect.height) * 100;

    img.style.transformOrigin = x + "% " + y + "%";

    img.style.transform = "scale(2)";
}

function resetZoom() {

    let img = document.getElementById("principal");

    img.style.transform = "scale(1)";
}

function abrirVisor() {

    if (window.innerWidth <= 768) {

        document.getElementById("imagenGrande").src =
            document.getElementById("principal").src;

        document.getElementById("visor").style.display = "flex";

    }
}

function cerrarVisor() {

    document.getElementById("visor").style.display = "none";

}

function abrirMenu(){

    document.getElementById("menu").classList.toggle("activo");

}



</script>

</body>
</html>
